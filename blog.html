<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0" />
    <meta name="description" content="jonathan.rs / blog" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="jonathan.rs / blog" />
    <meta property="og:site_name" content="jonathan.rs" />
    <meta property="og:url" content="https://jonathan.rs/blog.html" />
    <meta property="og:description" content="jonathan.rs / blog" />
    <title>jonathan.rs / blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&family=Unbounded:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: "Open Sans", system-ui, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }
      a { color: inherit; text-decoration: none; }
      a:hover { opacity: 0.7; }

      .page {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        padding: 40px 50px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
      }

      .wordmark {
        font-family: "Unbounded", "Open Sans", sans-serif;
        font-weight: 800;
        font-size: 2.4rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .wordmark .dot { opacity: 0.6; }
      .wordmark .slash {
        opacity: 0.4;
        margin: 0 0.4em;
        font-weight: 400;
      }
      .wordmark .crumb {
        font-weight: 800;
        font-size: 0.85em;
        letter-spacing: -0.01em;
      }

      .nav-back {
        font-family: "Unbounded", "Open Sans", sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        text-transform: lowercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        padding-bottom: 2px;
        transition: opacity 0.2s, border-color 0.2s;
      }
      .nav-back:hover { border-color: #fff; }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 0;
      }

      .empty {
        text-align: center;
        max-width: 480px;
      }
      .empty .rule {
        width: 40px;
        height: 1px;
        background: #fff;
        margin: 0 auto 28px;
        opacity: 0.5;
      }
      .empty h1 {
        font-family: "Unbounded", "Open Sans", sans-serif;
        font-weight: 800;
        font-size: 2.6rem;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
        line-height: 1.05;
      }
      .empty p {
        font-size: 1rem;
        line-height: 1.6;
        opacity: 0.6;
        margin: 0;
      }

      footer {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        opacity: 0.4;
        text-transform: lowercase;
      }

      @media (max-width: 1023px) {
        .page { padding: 22px 20px; }
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 14px;
        }
        .wordmark {
          font-size: 1.5rem;
          word-break: break-word;
        }
        .wordmark .slash { margin: 0 0.3em; }
        .nav-back { font-size: 0.8rem; }
        main { padding: 56px 0; }
        .empty .rule { margin-bottom: 22px; }
        .empty h1 { font-size: 1.9rem; }
        .empty p { font-size: 0.9rem; line-height: 1.55; }
        footer {
          font-size: 0.65rem;
          gap: 16px;
        }
      }
      @media (max-width: 380px) {
        .wordmark { font-size: 1.35rem; }
        .empty h1 { font-size: 1.65rem; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a href="/" class="wordmark"
          >jonathan<span class="dot">.</span>rs<span class="slash">/</span
          ><span class="crumb">blog</span></a
        >
        <a href="/" class="nav-back">&larr; back</a>
      </header>

      <main>
        <div class="empty">
          <div class="rule"></div>
          <h1>nothing here yet.</h1>
          <p>posts will arrive when they're ready. check back later.</p>
        </div>
      </main>

      <footer>
        <span>&copy; 2026 jonathan.rs</span>
        <span>blog</span>
      </footer>
    </div>
  </body>
</html>
