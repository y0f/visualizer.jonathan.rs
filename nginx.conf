worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        location ~ ^/(.+)/$ {
            return 301 /$1;
        }

        location ^~ /assets/audio/ {
            include /etc/nginx/security-headers.conf;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location ^~ /assets/img/ {
            include /etc/nginx/security-headers.conf;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot|css|js|glb|gltf|mp3|ogg|wav)$ {
            include /etc/nginx/security-headers.conf;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
